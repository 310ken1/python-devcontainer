[tools]
aws = { version = "latest", symlink_bins = "true" }
aws-sam = { version = "latest", symlink_bins = "true" }
node = "latest"
python = "latest"
uv = "latest"

[env]
VIRTUAL_ENV = "/workspace/.venv"
UV_VENV_CLEAR = "1"
SAM_CLI_CONTAINER_CONNECTION_TIMEOUT = 60
SAM_CLI_TELEMETRY = 0

[tasks.test]
description = "テスト実行（カバレッジ出力あり）"
run = "pytest -v --cov=src --cov-report=html tests"

[tasks.mock]
description = "APIモック実行"
run = """
cd api-mock
sam build
sam local start-api --debug
"""
interactive = true
